[core]
idle-time=0

[shell]
background-image=/usr/share/weston/cervus-background.png
background-type=scale-crop
background-color=0xff17151a
panel-position=top
panel-color=0xe0101820
clock-format=minutes
locking=false
animation=zoom
startup-animation=fade

[keyboard]
keymap_rules=evdev
keymap_model=pc105
keymap_layout=us,ru
keymap_options=grp:alt_shift_toggle

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/usr/bin/weston-flower

[launcher]
icon=/usr/share/weston/icon_window.png
path=/usr/bin/weston-smoke

[terminal]
font=monospace
font-size=14
