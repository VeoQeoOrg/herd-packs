[binaries]
c = 'x86_64-cervus-gcc'
cpp = 'x86_64-cervus-g++'
ar = 'x86_64-cervus-ar'
nm = 'x86_64-cervus-nm'
strip = 'x86_64-cervus-strip'
objcopy = 'x86_64-cervus-objcopy'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-O2', '-I' + staging + '/usr/include']
c_link_args = ['-L' + staging + '/usr/lib']
default_library = 'shared'
b_lundef = false
b_pie = true

[properties]
sys_root = staging
pkg_config_libdir = [staging + '/usr/lib/pkgconfig', staging + '/usr/share/pkgconfig']
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
